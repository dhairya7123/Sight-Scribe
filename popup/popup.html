<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SightScribe Controls</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v20M17 5v14M22 9v6M7 7v10M2 11v2"/>
          </svg>
        </div>
        <div>
          <h1>SightScribe</h1>
          <p class="subtitle">Live Captions & Screen Reader</p>
        </div>
      </div>
      <div class="header-actions">
        <!-- Settings Icon Button -->
        <button id="openSettingsBtn" class="btn-settings-icon" title="AI Model & API Key Settings" aria-label="Open Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <div id="statusBadge" class="status-badge idle">
          <span class="status-dot"></span>
          <span id="statusLabel">Idle</span>
        </div>
      </div>
    </header>

    <!-- Main Control Section -->
    <section class="main-controls">
      <!-- Big Toggle Button -->
      <button id="toggleBtn" class="btn-toggle start">
        <div class="btn-toggle-content">
          <svg class="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg class="icon-stop hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <rect x="5" y="5" width="14" height="14" rx="2"></rect>
          </svg>
          <div class="btn-text-group">
            <span id="toggleBtnText" class="btn-title">Start Captions</span>
            <span id="toggleBtnSub" class="btn-desc">Hear audio from current tab</span>
          </div>
        </div>
      </button>

      <!-- Open Side Panel Button -->
      <button id="openSidePanelBtn" class="btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
        <span>Open Side Panel Transcript</span>
      </button>

      <!-- Screen Reader Button -->
      <button id="toggleReaderBtn" class="btn-reader start" title="Read visible screen out loud (Alt+Shift+R)">
        <div class="reader-btn-content">
          <svg class="reader-icon-play" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg class="reader-icon-stop hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <rect x="5" y="5" width="14" height="14" rx="2"></rect>
          </svg>
          <div class="reader-text-group">
            <span id="readerBtnText" class="reader-title">Read Visible Screen</span>
            <span id="readerBtnSub" class="reader-desc">Shortcut: Alt+Shift+R</span>
          </div>
        </div>
      </button>

      <!-- Active Tab Card (Shown when listening) -->
      <div id="activeTabNotice" class="active-tab-notice hidden">
        <div class="tab-notice-header">
          <span class="pulse-ring"></span>
          <span class="notice-title">Capturing Tab Sound</span>
        </div>
        <div class="tab-details">
          <img id="popupFavicon" class="notice-favicon" src="" alt="">
          <span id="popupTabTitle" class="notice-tab-name">Tab Title</span>
        </div>
      </div>
    </section>

    <!-- Captioning Options Section (Remains visible on frontend) -->
    <section class="caption-options-section">
      <div class="options-header-row">
        <h2>Captioning Options</h2>
      </div>

      <div class="options-body">
        <!-- Spoken Language -->
        <div class="form-group">
          <label for="languageSelect">Audio Language</label>
          <select id="languageSelect">
            <option value="">Auto-Detect (Multilingual)</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="ja">Japanese</option>
            <option value="zh">Chinese</option>
            <option value="ko">Korean</option>
            <option value="hi">Hindi</option>
            <option value="ar">Arabic</option>
            <option value="ru">Russian</option>
            <option value="nl">Dutch</option>
            <option value="pl">Polish</option>
            <option value="tr">Turkish</option>
          </select>
        </div>

        <!-- Chunk Duration -->
        <div class="form-group">
          <div class="label-with-value">
            <label for="chunkDurationRange">Chunk Interval</label>
            <span id="chunkDurationVal" class="value-badge">3.5s</span>
          </div>
          <input type="range" id="chunkDurationRange" min="2.0" max="6.0" step="0.5" value="3.5" />
          <span class="form-help">Shorter = faster caption updates; Longer = higher lyric context</span>
        </div>

        <!-- Silence / VAD Sensitivity -->
        <div class="form-group">
          <div class="label-with-value">
            <label for="vadThresholdRange">Silence Filter (VAD)</label>
            <span id="vadThresholdVal" class="value-badge">Normal</span>
          </div>
          <input type="range" id="vadThresholdRange" min="0.002" max="0.02" step="0.002" value="0.008" />
          <span class="form-help">Skips API calls during song pauses or video silence</span>
        </div>
      </div>
    </section>

    <!-- Settings Menu Modal (Opened by clicking the Settings Icon) -->
    <div id="settingsModal" class="settings-modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-backdrop" id="closeSettingsBackdrop"></div>
      <div class="settings-dialog">
        <div class="settings-dialog-header">
          <div class="settings-title-wrap">
            <svg class="settings-title-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <h2 id="settingsTitle">AI Engine & Model Settings</h2>
          </div>
          <button id="closeSettingsBtn" class="close-dialog-btn" title="Close Settings" aria-label="Close Settings">&times;</button>
        </div>

        <div class="settings-dialog-body">
          <!-- Speech AI Engine -->
          <div class="form-group">
            <label for="providerSelect">Speech AI Engine</label>
            <select id="providerSelect">
              <option value="groq">Groq Whisper Turbo (Free & Blazing Fast)</option>
              <option value="openai">OpenAI Whisper API</option>
              <option value="custom">Custom Whisper / OpenAI Compatible</option>
            </select>
          </div>

          <!-- API Key Input -->
          <div class="form-group">
            <div class="label-with-link">
              <label for="apiKeyInput">API Key</label>
              <a href="https://console.groq.com/keys" target="_blank" id="apiKeyLink" class="helper-link">Get Free Key ↗</a>
            </div>
            <div class="input-with-action">
              <input type="password" id="apiKeyInput" placeholder="gsk_... or sk-..." />
              <button type="button" id="toggleKeyVisibilityBtn" class="action-btn" title="Show/Hide Key">
                <svg id="eyeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <div class="test-key-row">
              <button type="button" id="testApiKeyBtn" class="btn-outline-sm">Test Connection</button>
              <span id="testKeyStatus" class="test-status"></span>
            </div>
          </div>

          <!-- Model Selection -->
          <div class="form-group">
            <label for="modelSelect">AI Model</label>
            <select id="modelSelect">
              <option value="whisper-large-v3-turbo">whisper-large-v3-turbo (Recommended)</option>
              <option value="whisper-large-v3">whisper-large-v3 (Highest Accuracy)</option>
            </select>
          </div>

          <!-- Custom Endpoint (Shown if provider is custom) -->
          <div class="form-group hidden" id="customEndpointGroup">
            <label for="customEndpointInput">Custom Endpoint URL</label>
            <input type="text" id="customEndpointInput" placeholder="http://localhost:8000/v1/audio/transcriptions" />
          </div>

          <!-- Save button feedback -->
          <div class="settings-footer">
            <button id="saveSettingsBtn" class="btn-save">Save Settings</button>
            <span id="saveStatus" class="save-status"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Error Toast -->
    <div id="popupToast" class="popup-toast hidden">
      <span id="popupToastMessage"></span>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
