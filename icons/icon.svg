<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" />

  <!-- Inner border glow -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Audio Waveform Bars (Representing Hearing Songs/Videos) -->
  <g fill="url(#waveGrad)" filter="url(#glow)">
    <rect x="26" y="44" width="8" height="24" rx="4" opacity="0.85" />
    <rect x="38" y="34" width="8" height="44" rx="4" />
    <rect x="50" y="24" width="8" height="64" rx="4" />
    <rect x="62" y="30" width="8" height="52" rx="4" />
    <rect x="74" y="20" width="8" height="72" rx="4" />
    <rect x="86" y="36" width="8" height="40" rx="4" />
    <rect x="98" y="46" width="8" height="20" rx="4" opacity="0.85" />
  </g>

  <!-- Caption Subtitle Bar (Representing Text / Inscription) -->
  <rect x="24" y="98" width="80" height="10" rx="5" fill="#ffffff" filter="url(#glow)" />
  <rect x="34" y="112" width="60" height="4" rx="2" fill="rgba(255,255,255,0.6)" />
</svg>
